name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: dotnet test

      - name: Build
        run: |
          # Tag v1.2.3 -> assembly version 1.2.3, which the plugin's update check compares against.
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0"
          dotnet build src/EmbyGitHubPlugins -c Release -p:Version="$VERSION"
          cp src/EmbyGitHubPlugins/bin/Release/netstandard2.0/EmbyGitHubPlugins.dll .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyGitHubPlugins
          path: EmbyGitHubPlugins.dll

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EmbyGitHubPlugins.dll
          generate_release_notes: true
